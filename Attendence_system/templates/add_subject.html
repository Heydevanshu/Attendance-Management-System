<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Subject</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_subject.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container1">
            <div><p>Welcome</p></div>
       <h3><span><b>STUDENT ATTENDENCE MANAGEMENT SYSTEM</b></span></h3> 
        <div class="ms-auto"></div>
    </div>
     <p>Welcome, {{ teacher_name }} (Teacher ID: {{ teacher_id }})</p>
    </nav>
<div class="container">
    <h2>Add New Subject</h2>

   <form method="POST">
    <label>Subject Name:</label>
    <input type="text" name="name" required>

    <label>Branch:</label>
    <select name="branch" required>
        <option value="" selected>Select Branch</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">Mechanical</option>
        <option value="CIVIL">Civil</option>
    </select>

   <label>Academic Year:</label>
<select name="year" required>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
    <option value="4">4th Year</option>
</select>

<label>Semester:</label>
<select name="semester" required>
    {% for i in range(1, 9) %}
        <option value="{{ i }}">Semester {{ i }}</option>
    {% endfor %}
</select>

    <label>Teacher Assign:</label>
    <select name="teacher_id" required>
        <option value="">Select Teacher</option>
        {% for t in teachers %}
            <option value="{{ t.id }}">{{ t.name }} (ID: {{ t.id }})</option>
        {% endfor %}
    </select>

    <button type="submit">Add Subject</button>
</form>

    <a class="btn" href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a>
</div>
</body>
</html>
